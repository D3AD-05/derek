<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Default Title{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <style>
        @media only screen and (max-width: 600px) {
            .content {
                width: 100% !important;
            }
            .button {
                width: 100% !important;
                padding: 14px 0 !important;
            }
        }

        body {
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: #1e293b;
        }

        .content {
            background-color: #ffffff;
            margin: 30px auto;
            max-width: 600px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .header {
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 26px;
            letter-spacing: 0.5px;
        }

        .body {
            padding: 25px;
        }

        .body h2 {
            color: #2563eb;
            margin-top: 0;
            font-size: 20px;
        }

        .body p {
            color: #475569;
            font-size: 15px;
            line-height: 1.6;
        }

        .button-container {
            text-align: center;
            margin: 25px 0;
        }

        .button {
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            color: #ffffff !important;
            text-decoration: none;
            padding: 12px 26px;
            font-size: 15px;
            border-radius: 6px;
            display: inline-block;
            font-weight: bold;
        }

        .footer {
            background-color: #f8fafc;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
        }

        .footer p {
            font-size: 12px;
            color: #94a3b8;
            margin: 0;
        }

        a {
            color: #ffffff !important;
            text-decoration: none !important;
        }
    </style>
</head>

<body>
    <table class="content">
        <!-- Header -->
        <tr>
            <td class="header">
                <h1>Derek</h1>
            </td>
        </tr>

        <!-- Body -->
        <tr>
            <td class="body">
                {% block body %}{% endblock %}
            </td>
        </tr>

        <!-- Footer -->
        <tr>
            <td class="footer">
                <p>© 2026 Derek. All rights reserved.</p>
            </td>
        </tr>
    </table>
</body>
</html>
